<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #1E3932;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 400px;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            background: #00704A;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .page { display: none; padding: 24px; }
        .page.active { display: block; }

        h2 {
            color: #1E3932;
            margin-bottom: 20px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00704A;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        button:hover { background: #1E3932; }

        .switch-link {
            text-align: center;
            color: #00704A;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }

        .switch-link:hover { text-decoration: underline; }

        .error {
            color: red;
            font-size: 13px;
            margin-bottom: 8px;
            text-align: center;
        }

        .success {
            color: green;
            font-size: 13px;
            margin-bottom: 8px;
            text-align: center;
        }

        /* Chat styles */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user-message {
            background: #00704A;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            background: #f0f0f0;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            border-top: 1px solid #eee;
            gap: 8px;
        }

        .chat-input input {
            flex: 1;
            margin-bottom: 0;
            border-radius: 24px;
        }

        .chat-input button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
            margin: 0;
            font-size: 18px;
        }

        .logout {
            text-align: right;
            padding: 8px 16px;
            font-size: 13px;
            color: #00704A;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">☕ Starbucks Barista</div>

    <!-- Register Page -->
    <div class="page active" id="registerPage">
        <h2>Create Account</h2>
        <div class="error" id="registerError"></div>
        <div class="success" id="registerSuccess"></div>
        <input type="text" id="regUsername" placeholder="Username" />
        <input type="password" id="regPassword" placeholder="Password" />
        <input type="password" id="regConfirm" placeholder="Confirm Password" />
        <button onclick="register()">Register</button>
        <div class="switch-link" onclick="showPage('loginPage')">
            Already have an account? Login
        </div>
    </div>

    <!-- Login Page -->
    <div class="page" id="loginPage">
        <h2>Welcome Back</h2>
        <div class="error" id="loginError"></div>
        <input type="text" id="loginUsername" placeholder="Username" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button onclick="login()">Login</button>
        <div class="switch-link" onclick="showPage('registerPage')">
            Don't have an account? Register
        </div>
    </div>

    <!-- Chat Page -->
    <div class="page" id="chatPage">
        <div class="logout" onclick="logout()">Logout ↩</div>
        <div class="chat-container">
            <div class="chat-messages" id="messages">
                <div class="message bot-message">
                    Hi! Welcome to Starbucks! What can I get started for you? ☕
                </div>
            </div>
            <div class="chat-input">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your order..."
                    onkeypress="handleKey(event)"
                />
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = null;

    function showPage(pageId) {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById(pageId).classList.add("active");
    }

    async function register() {
        const username = document.getElementById("regUsername").value.trim();
        const password = document.getElementById("regPassword").value;
        const confirm = document.getElementById("regConfirm").value;

        document.getElementById("registerError").textContent = "";
        document.getElementById("registerSuccess").textContent = "";

        if (!username || !password) {
            document.getElementById("registerError").textContent = "Please fill all fields.";
            return;
        }

        if (password !== confirm) {
            document.getElementById("registerError").textContent = "Passwords don't match!";
            return;
        }

        const res = await fetch("https://starbucks-bot-6ue0.onrender.com/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
            document.getElementById("registerSuccess").textContent = "Account created! Please login.";
            setTimeout(() => showPage("loginPage"), 1500);
        } else {
            document.getElementById("registerError").textContent = data.error;
        }
    }

    async function login() {
        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;

        document.getElementById("loginError").textContent = "";

        const res = await fetch("https://starbucks-bot-6ue0.onrender.com/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
            currentUser = data.username;
            showPage("chatPage");
        } else {
            document.getElementById("loginError").textContent = data.error;
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";

        const res = await fetch("https://starbucks-bot-6ue0.onrender.com/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: message,
                thread_id: currentUser
            })
        });

        const data = await res.json();
        addMessage(data.response, "bot");
    }

    function addMessage(text, sender) {
        const messages = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = `message ${sender}-message`;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }

    function handleKey(event) {
        if (event.key === "Enter") sendMessage();
    }

    function logout() {
        currentUser = null;
        showPage("loginPage");
    }
</script>
</body>
</html>
